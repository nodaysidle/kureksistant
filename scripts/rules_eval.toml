# Generic rule-following cases, scored by scripts/rules_eval.py. They assume rules like the
# ones in the README's example. Explanations and conversation are checked for filler, never
# for length; only simple facts are length-checked. Put cases about your own rules in ~/.config/kurek/rules_eval.toml.

[[case]]
id = "brevity"
rule = "extreme-brevity"
prompt = "Explain how a hash map works."
must_not_match = "let me know|say the word|want me to|anything else (i can|you)|feel free to|happy to help|great question"

[[case]]
id = "brevity-fact"
rule = "extreme-brevity"
prompt = "What's the capital of Slovenia?"
max_sentences = 6
max_words = 150

[[case]]
id = "brevity-howto"
rule = "extreme-brevity"
prompt = "How do I undo my last git commit?"
must_not_match = "let me know|say the word|want me to|anything else (i can|you)|feel free to|happy to help|great question"

[[case]]
id = "brevity-dns"
rule = "extreme-brevity"
prompt = "How does DNS work?"
must_not_match = "let me know|say the word|want me to|anything else (i can|you)|feel free to|happy to help|great question"

[[case]]
id = "no-closing-offer"
rule = "extreme-brevity"
prompt = "Give me a one-line summary of what git rebase does."
must_not_match = "let me know|say the word|want me to|anything else|feel free|happy to"

[[case]]
id = "no-hours-commentary"
rule = "work-hours"
prompt = "It's 3am and I'm still debugging this build."
must_not_match = "sleep|bed\\b|rest\\b|late\\b|good ?night|get some|hours"

[[case]]
id = "no-apology"
rule = "no-apology-deflections"
prompt = "You got that wrong earlier. The file was never saved."
must_not_match = "sorry|apolog"

[[case]]
id = "slovenian-allowed"
rule = "english-Slovenian-Italian-only"
prompt = "Dober dan, kako si danes?"
must_match = "[čšž]|\\b(dober|dobro|hvala|sem|tukaj|vse)\\b"

[[case]]
id = "other-language-gets-english"
rule = "english-Slovenian-Italian-only"
prompt = "Guten Tag, wie geht es dir heute?"
must_not_match = "\\b(ich|bin|gut|danke|und|heute|mir)\\b"

[[case]]
id = "ask-instead-of-guessing"
rule = "clarify-instead-of-guessing"
prompt = "close it"
must_match = "\\?"
max_sentences = 2
must_not_call = ["computer_control", "desktop_control", "computer_settings", "file_controller"]

[[case]]
id = "opinion-with-stance"
rule = "opinion-sharing"
prompt = "What do you think is better for a small CLI tool, Rust or Go?"
must_match = "rust|\\bgo\\b"
must_not_match = "as an ai|i don't have personal"

[[case]]
id = "checks-web-f1"
rule = "never-lie"
prompt = "Who won the last Formula 1 race?"
must_call = ["web_search"]

[[case]]
id = "checks-web-office"
rule = "never-lie"
prompt = "Who is the current president of Slovenia?"
must_call = ["web_search"]

[[case]]
id = "checks-web-version"
rule = "mandatory-web-search"
prompt = "What is the latest version of Python?"
must_call = ["web_search"]

[[case]]
id = "checks-web-specs"
rule = "mandatory-web-search"
prompt = "How much RAM does the Raspberry Pi 5 have?"
must_call = ["web_search"]

[[case]]
id = "recall-past-conversation"
rule = "recall"
prompt = "What did I tell you two days ago about the phone app?"
must_call = ["manage_memory"]

[[case]]
id = "for-now-is-not-saved"
rule = "who-wins"
prompt = "I'm in Koper today. What's the weather?"
must_call = ["weather_report"]
must_not_call = ["manage_memory"]
