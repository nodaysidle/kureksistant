# Dependencies: requirements.txt is the single source of truth for runtime deps
# (exact pins in requirements.lock, dev tools in requirements-dev.txt). This file
# carries tool configuration only; Kurek is not an installable package.

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["dist", "android", ".trail", ".claude"]

[tool.ruff.lint]
# Enforced in CI (`ruff check .`) — keep local and CI identical.
#   E9/F63/F7: syntax and invalid statements · F82: undefined names
#   B006/B008: mutable / call-expression argument defaults
# Ratchet target (NOT enforced yet): F401 unused imports, then E, W, F, I, B, UP, SIM.
select = ["E9", "F63", "F7", "F82", "F401", "B006", "B008"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Added by polishpy: tool.mypy ---
# NOT enforced: CI does not run mypy. Aspirational strict settings for local use.
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# --- End polishpy: tool.mypy ---

[tool.pytest.ini_options]
testpaths = ["tests"]
