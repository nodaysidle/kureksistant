name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system audio / tk / build deps
        run: |
          sudo apt-get update -qq
          # xvfb: headless DISPLAY for pyautogui/mouseinfo at pytest collection
          sudo apt-get install -y -qq libportaudio2 python3-tk gcc shellcheck xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + dev Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (rule set lives in pyproject.toml [tool.ruff.lint])
        run: ruff check .

      - name: Build kurek-trigger (-Wall -Wextra -Werror)
        run: |
          gcc -O3 -Wall -Wextra -Werror bin/kurek-trigger.c -o /tmp/kurek-trigger-ci
          test -x /tmp/kurek-trigger-ci

      - name: Shellcheck installer, CLI and launcher
        run: shellcheck -x install_linux.sh bin/kurek launch_kurek.sh scripts/package_release.sh scripts/verify.sh

      - name: Install ripgrep (codebase/run tool tests)
        run: sudo apt-get install -y -qq ripgrep && rg --version | head -1

      - name: Trigger latency bench (informational)
        run: |
          # Soft bound only — print results; never fail the job on the bench.
          python scripts/bench_trigger.py --runs 200 --trigger /tmp/kurek-trigger-ci --sanity-ms 50 \
            || echo "::warning::bench_trigger soft-fail (ignored for CI gate)"

      - name: Packaging deny-list (dry-run build)
        run: |
          chmod +x scripts/package_release.sh
          VERSION=0.2.0 OUT_DIR="$RUNNER_TEMP/kurek-dist" ./scripts/package_release.sh

      - name: Test suite (offline / no API keys)
        # pyautogui imports mouseinfo, which requires DISPLAY (KeyError without X).
        # Deselect: needs host-installed grok-bot.desktop (absent on GitHub runners).
        run: xvfb-run -a pytest -q tests/ --deselect tests/test_open_app_grokbot.py::test_find_grok_desktop_file
