name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system audio / tk / build deps
        run: |
          sudo apt-get update -qq
          # xvfb: headless DISPLAY for pyautogui/mouseinfo at pytest collection
          sudo apt-get install -y -qq libportaudio2 python3-tk gcc shellcheck xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install daemon + CI Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Ruff syntax/runtime (daemon path — exclude legacy GUI)
        run: |
          # E9/F63/F7: syntax & invalid-statement checks; F821: undefined names.
          ruff check \
            kurek_daemon.py \
            core \
            actions \
            memory \
            bin \
            scripts \
            tests \
            setup.py \
            --select E9,F63,F7,F821 \
            --exclude legacy

      - name: Build kurek-trigger (-Wall -Wextra -Werror)
        run: |
          gcc -O3 -Wall -Wextra -Werror bin/kurek-trigger.c -o /tmp/kurek-trigger-ci
          test -x /tmp/kurek-trigger-ci

      - name: Shellcheck installer
        run: shellcheck -x install_linux.sh

      - name: Trigger latency bench (informational)
        run: |
          # Soft bound only — print results; never fail the job on the bench.
          python scripts/bench_trigger.py --runs 200 --trigger /tmp/kurek-trigger-ci --sanity-ms 50 \
            || echo "::warning::bench_trigger soft-fail (ignored for CI gate)"

      - name: Packaging deny-list (dry-run build)
        run: |
          chmod +x scripts/package_release.sh
          VERSION=0.2.0 OUT_DIR="$RUNNER_TEMP/kurek-dist" ./scripts/package_release.sh

      - name: Test suite (offline / no API keys)
        # pyautogui imports mouseinfo, which requires DISPLAY (KeyError without X).
        # Stub grok-bot.desktop so test_find_grok_desktop_file can resolve XDG apps
        # without changing tests or requiring a real GrokBot install on the runner.
        run: |
          mkdir -p "$HOME/.local/share/applications"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Grok Bot' \
            'Exec=true' \
            'StartupWMClass=grok-bot' \
            > "$HOME/.local/share/applications/grok-bot.desktop"
          xvfb-run -a pytest -q tests/
